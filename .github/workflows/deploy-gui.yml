name: Deploy GUI to GitHub Pages

# Build the Marimo + Pyodide WASM bundle of the 2D alignment GUI and
# publish it to GitHub Pages on every push to main. The hosted page
# runs entirely in the user's browser — no server, no cold start.
#
# Prerequisite (one-time, do this in the GitHub UI):
#   Settings → Pages → Source: "GitHub Actions"

on:
  push:
    branches: [main]
    paths:
      - "src/mis_contact_fea/gui/align_marimo.py"
      - ".github/workflows/deploy-gui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancel in-progress runs on new commits.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install marimo
        run: pip install --quiet marimo

      - name: Export Marimo notebook to WASM HTML
        run: |
          marimo export html-wasm \
            src/mis_contact_fea/gui/align_marimo.py \
            -o ./public \
            --mode run

      - name: Add no-jekyll marker (safety; marimo writes one too)
        run: touch ./public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
